version: "3.8"
services:
   api:
     build:
       context: .
       dockerfile: Dockerfile.compose
     depends_on:
       - "db"
       - "redis"
     network_mode: host
     volumes:
       - type: bind
         source: /home/${USER}/.config/gcloud/application_default_credentials.json
         target: /build/.config/gcloud/application_default_credentials.json
     environment:
     # If you don't have this file run 'gcloud auth application default-login'
       GOOGLE_APPLICATION_CREDENTIALS: /build/.config/gcloud/application_default_credentials.json
       PORT: 7070
     command: go run ./cmd/apiServer/main.go

   game:
     build:
       context: .
       dockerfile: Dockerfile.compose
     depends_on:
       - "db"
     network_mode: host
     environment:
       PORT: 6060
     command: go run ./cmd/gameServer/main.go

   db:
     image: postgres:14.1-alpine
     environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
     network_mode: host
     volumes: 
        - db:/var/lib/postgresql/data

   redis:
     image: redis:7.0.2
     ports:
       - "6379:6379"

volumes:
  db:
    driver: local
